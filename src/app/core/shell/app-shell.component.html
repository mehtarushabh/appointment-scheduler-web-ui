<mat-toolbar class="app-shell-toolbar">
  <span class="app-shell-title">{{ title() }}</span>

  @if (loggedIn()) {
    <a
      mat-button
      routerLink="/home"
      routerLinkActive
      #homeActive="routerLinkActive"
      [routerLinkActiveOptions]="{ exact: true }"
      [color]="homeActive.isActive ? 'accent' : undefined"
      [class.app-nav-link-active]="homeActive.isActive"
    >
      Home
    </a>

    @for (link of navLinks(); track link.path) {
      @if (link.path === scheduleAppointmentPath && scheduleAppointmentDisabled()) {
        <button mat-button type="button" disabled>{{ link.label }}</button>
      } @else {
        <a
          mat-button
          [routerLink]="link.path"
          routerLinkActive
          #linkActive="routerLinkActive"
          [color]="linkActive.isActive ? 'accent' : undefined"
          [class.app-nav-link-active]="linkActive.isActive"
        >
          {{ link.label }}
        </a>
      }
    }

    <span class="app-shell-spacer"></span>

    <button mat-button [matMenuTriggerFor]="userMenu">{{ userName() }}</button>
    <mat-menu #userMenu="matMenu">
      <button mat-menu-item routerLink="/edit-profile">Edit profile</button>
      <button mat-menu-item (click)="logout()">Logout</button>
    </mat-menu>
  }
</mat-toolbar>

<router-outlet />
