<form class="app-form-wide" [formGroup]="form" (ngSubmit)="submit()">
  <h2>Onboard another clinic admin</h2>

  <mat-card class="app-section">
    <mat-card-content>
      <mat-form-field appearance="outline">
        <mat-label>First name</mat-label>
        <input matInput formControlName="firstName" />
      </mat-form-field>

      <mat-form-field appearance="outline">
        <mat-label>Last name</mat-label>
        <input matInput formControlName="lastName" />
      </mat-form-field>

      <mat-form-field appearance="outline">
        <mat-label>Email</mat-label>
        <input matInput type="email" formControlName="email" />
      </mat-form-field>

      <mat-form-field appearance="outline">
        <mat-label>Date of birth</mat-label>
        <input matInput [matDatepicker]="dobPicker" formControlName="dateOfBirth" />
        <mat-datepicker-toggle matIconSuffix [for]="dobPicker" />
        <mat-datepicker #dobPicker />
      </mat-form-field>

      <app-address-form [group]="form.controls.address" />

      <mat-form-field appearance="outline">
        <mat-label>Biological sex</mat-label>
        <mat-select formControlName="biologicalSex">
          @for (option of biologicalSexOptions; track option) {
            <mat-option [value]="option">{{ option }}</mat-option>
          }
        </mat-select>
      </mat-form-field>
    </mat-card-content>
  </mat-card>

  <button mat-flat-button type="submit" [disabled]="form.invalid">Onboard clinic admin</button>
</form>
