<table mat-table [dataSource]="clinics()">
  <ng-container matColumnDef="name">
    <th mat-header-cell *matHeaderCellDef>Clinic name</th>
    <td mat-cell *matCellDef="let clinic">{{ clinic.name }}</td>
  </ng-container>

  <ng-container matColumnDef="registeredId">
    <th mat-header-cell *matHeaderCellDef>Registered ID</th>
    <td mat-cell *matCellDef="let clinic">{{ clinic.registeredId }}</td>
  </ng-container>

  <ng-container matColumnDef="firstClinicAdmin">
    <th mat-header-cell *matHeaderCellDef>Clinic admin</th>
    <td mat-cell *matCellDef="let clinic">{{ clinic.firstClinicAdmin?.email }}</td>
  </ng-container>

  <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>
  <tr mat-row *matRowDef="let row; columns: displayedColumns"></tr>
</table>
