<form class="app-form-wide" [formGroup]="form" (ngSubmit)="submit()">
  <h2>Onboard a clinic</h2>

  <mat-card class="app-section">
    <mat-card-header>
      <mat-card-title>Clinic details</mat-card-title>
    </mat-card-header>
    <mat-card-content>
      <mat-form-field appearance="outline">
        <mat-label>Clinic name</mat-label>
        <input matInput formControlName="name" />
      </mat-form-field>

      <mat-form-field appearance="outline">
        <mat-label>Registered ID</mat-label>
        <input matInput formControlName="registeredId" />
      </mat-form-field>

      <app-address-form [group]="form.controls.address" />
    </mat-card-content>
  </mat-card>

  <mat-card class="app-section">
    <mat-card-header>
      <mat-card-title>First clinic admin</mat-card-title>
    </mat-card-header>
    <mat-card-content>
      <mat-form-field appearance="outline">
        <mat-label>First name</mat-label>
        <input matInput formControlName="adminFirstName" />
      </mat-form-field>

      <mat-form-field appearance="outline">
        <mat-label>Last name</mat-label>
        <input matInput formControlName="adminLastName" />
      </mat-form-field>

      <mat-form-field appearance="outline">
        <mat-label>Email</mat-label>
        <input matInput type="email" formControlName="adminEmail" />
      </mat-form-field>

      <mat-form-field appearance="outline">
        <mat-label>Date of birth</mat-label>
        <input matInput [matDatepicker]="dobPicker" formControlName="adminDateOfBirth" />
        <mat-datepicker-toggle matIconSuffix [for]="dobPicker" />
        <mat-datepicker #dobPicker />
      </mat-form-field>

      <app-address-form [group]="form.controls.adminAddress" />

      <mat-form-field appearance="outline">
        <mat-label>Biological sex</mat-label>
        <mat-select formControlName="adminBiologicalSex">
          @for (option of biologicalSexOptions; track option) {
            <mat-option [value]="option">{{ option }}</mat-option>
          }
        </mat-select>
      </mat-form-field>
    </mat-card-content>
  </mat-card>

  <button mat-flat-button type="submit" [disabled]="form.invalid">Onboard clinic</button>
</form>
