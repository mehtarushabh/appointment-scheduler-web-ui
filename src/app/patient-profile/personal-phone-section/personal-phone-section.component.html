<form [formGroup]="form" (ngSubmit)="save()">
  <mat-card-content>
    <mat-form-field appearance="outline">
      <mat-label>Personal phone</mat-label>
      <input matInput formControlName="personalPhone" />
    </mat-form-field>
  </mat-card-content>
  <mat-card-actions>
    <button mat-flat-button type="submit" [disabled]="form.invalid">Save personal phone</button>
  </mat-card-actions>
</form>
