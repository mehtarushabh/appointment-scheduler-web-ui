<form [formGroup]="form" (ngSubmit)="save()">
  <mat-card-content>
    <mat-form-field appearance="outline">
      <mat-label>Contact full name</mat-label>
      <input matInput formControlName="contactFullName" />
    </mat-form-field>

    <mat-form-field appearance="outline">
      <mat-label>Relationship to patient</mat-label>
      <mat-select formControlName="relationship">
        @for (option of relationshipOptions; track option) {
          <mat-option [value]="option">{{ option }}</mat-option>
        }
      </mat-select>
    </mat-form-field>

    <mat-form-field appearance="outline">
      <mat-label>Primary phone number</mat-label>
      <input matInput formControlName="primaryPhone" />
    </mat-form-field>

    <mat-form-field appearance="outline">
      <mat-label>Secondary phone number (optional)</mat-label>
      <input matInput formControlName="secondaryPhone" />
    </mat-form-field>
  </mat-card-content>
  <mat-card-actions>
    <button mat-flat-button type="submit" [disabled]="form.invalid">Save emergency contact</button>
  </mat-card-actions>
</form>
