<div class="app-page">
  <mat-card>
    <div class="app-page-header">
      <h1>Patients</h1>
    </div>

    @if (patients().length === 0) {
      <p>No patients at this clinic yet.</p>
    } @else {
      <table mat-table [dataSource]="patients()" multiTemplateDataRows>
        <ng-container matColumnDef="name">
          <th mat-header-cell *matHeaderCellDef>Name</th>
          <td mat-cell *matCellDef="let patient">{{ patient.firstName }} {{ patient.lastName }}</td>
        </ng-container>

        <ng-container matColumnDef="email">
          <th mat-header-cell *matHeaderCellDef>Email</th>
          <td mat-cell *matCellDef="let patient">{{ patient.email }}</td>
        </ng-container>

        <ng-container matColumnDef="expandedDetail">
          <td mat-cell *matCellDef="let patient" [attr.colspan]="displayedColumns.length">
            @if (profileFor(patient); as profile) {
              <app-patient-profile-view [profile]="profile" />
            } @else {
              <p>Loading...</p>
            }
          </td>
        </ng-container>

        <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>
        <tr mat-row class="app-clickable-row" *matRowDef="let patient; columns: displayedColumns" (click)="toggle(patient)"></tr>
        <tr mat-row *matRowDef="let patient; columns: ['expandedDetail']" [hidden]="!isExpanded(patient)"></tr>
      </table>
    }
  </mat-card>
</div>
